<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TextAlive API Test Site</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">TextAlive App API</p>
          <h1>Lyric Sync Tester</h1>
        </div>
        <div class="status-pill" id="status">初期化中</div>
      </header>

      <main class="workspace">
        <section class="stage" aria-label="歌詞表示">
          <div class="stage-grid" aria-hidden="true"></div>
          <div class="phrase-wrap">
            <p class="phrase-label">Phrase</p>
            <div class="phrase" id="phrase">歌詞を読み込み中</div>
            <div class="word-row">
              <span id="word">-</span>
              <span id="char">-</span>
            </div>
          </div>
          <div class="beat-meter" aria-hidden="true">
            <div id="beatBar"></div>
          </div>
        </section>

        <aside class="side-panel" aria-label="楽曲情報">
          <div class="song-meta">
            <div>
              <span>Song</span>
              <strong id="songTitle">-</strong>
            </div>
            <div>
              <span>Artist</span>
              <strong id="artistName">-</strong>
            </div>
          </div>

          <div class="metric-grid">
            <div class="metric">
              <span>Position</span>
              <strong id="position">0:00.000</strong>
            </div>
            <div class="metric">
              <span>Beat</span>
              <strong id="beat">-</strong>
            </div>
            <div class="metric">
              <span>Chord</span>
              <strong id="chord">-</strong>
            </div>
            <div class="metric">
              <span>Chorus</span>
              <strong id="chorus">-</strong>
            </div>
          </div>

          <div class="counts">
            <span id="phraseCount">phrases -</span>
            <span id="wordCount">words -</span>
            <span id="charCount">chars -</span>
          </div>

          <div class="log-box">
            <div class="panel-title">Events</div>
            <ol id="events"></ol>
          </div>
        </aside>
      </main>

      <section class="control-panel" id="controlPanel" aria-label="再生操作">
        <form id="loadForm" class="song-form">
          <label for="songUrl">URL</label>
          <input id="songUrl" name="songUrl" type="url" autocomplete="off" />
          <button id="loadSong" type="submit">Load</button>
        </form>

        <div class="transport">
          <button type="button" id="play" aria-label="再生" title="再生" disabled>▶</button>
          <button type="button" id="pause" aria-label="一時停止" title="一時停止" disabled>Ⅱ</button>
          <button type="button" id="stop" aria-label="停止" title="停止" disabled>■</button>
          <button type="button" id="rewind" aria-label="先頭へ戻る" title="先頭へ戻る" disabled>↺</button>
          <button type="button" id="jump" aria-label="歌詞の先頭へ" title="歌詞の先頭へ" disabled>|&lt;</button>
        </div>

        <div class="seek-row">
          <input id="seek" type="range" min="0" max="0" value="0" step="100" disabled />
          <span id="duration">0:00.000</span>
        </div>
      </section>

      <div id="media" aria-hidden="true"></div>
    </div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/textalive-app-api/dist/index.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
