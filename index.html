<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TAKEOVER Camera Stage</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000308'/%3E%3Cpath d='M18 42 32 12l14 30-14-8z' fill='%2339c5bb'/%3E%3Cpath d='M24 46h16' stroke='%23ffd166' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DotGothic16&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="stage-shell">
      <div id="start-screen" class="start-screen" role="button" tabindex="0" aria-label="タップして開始">
        <canvas id="start-stars" class="start-stars-canvas" aria-hidden="true"></canvas>
        <div class="start-inner">
          <p class="start-label">初音ミク 「マジカルミライ 2026」</p>
          <h1 class="start-title">TAKEOVER</h1>
          <p class="start-artist"><span class="start-credit-label">Music by</span>Twinfield</p>
          <div class="start-cta-wrap">
            <span id="startCta" class="start-cta">TOUCH TO START</span>
          </div>
        </div>
      </div>

      <canvas id="stage-canvas" aria-label="3D model camera stage"></canvas>

      <div id="blackout" class="blackout" hidden></div>

      <div id="replay-screen" class="replay-screen" hidden>
        <canvas id="replay-stars" class="start-stars-canvas" aria-hidden="true"></canvas>
        <div class="start-inner">
          <p class="start-label">初音ミク 「マジカルミライ 2026」</p>
          <h2 class="start-title">TAKEOVER</h2>
          <p class="start-artist"><span class="start-credit-label">Music by</span>Twinfield</p>
          <div class="start-cta-wrap">
            <button id="replayBtn" class="replay-cta" type="button">&#9654; もう一度再生</button>
          </div>
        </div>
      </div>
      <div id="typography-layer" class="typography-layer" aria-hidden="true"></div>

      <header class="stage-hud" hidden>
        <div class="now-playing" aria-live="polite">
          <p>TEXTALIVE CAMERA STAGE</p>
          <div>
            <strong id="songTitle">TAKEOVER</strong>
            <span id="artistName">Twinfield</span>
          </div>
        </div>
      </header>

      <aside class="shot-panel" aria-label="current camera and phrase" hidden>
        <span id="shotName">Shot 01</span>
        <span id="animationName">Animation loading</span>
      </aside>



      <footer class="controls-overlay" id="controlPanel" aria-label="playback controls" hidden>
        <div class="transport">
          <button type="button" id="play" aria-label="Play" title="Play" disabled>&#9654;</button>
          <button type="button" id="pause" aria-label="Pause" title="Pause" disabled>II</button>
          <button type="button" id="stop" aria-label="Stop" title="Stop" disabled>&#9632;</button>
          <button type="button" id="rewind" aria-label="Rewind" title="Rewind" disabled>&#8634;</button>
          <button type="button" id="jump" aria-label="Jump to first phrase" title="Jump to first phrase" disabled>|&lt;</button>
        </div>

        <div class="seek-row">
          <input id="seek" type="range" min="0" max="0" value="0" step="100" disabled aria-label="Seek" />
          <span class="time-display">
            <span id="position">0:00.000</span>
            <span class="time-sep">/</span>
            <span id="duration">0:00.000</span>
          </span>
        </div>
      </footer>
    </main>

    <div hidden aria-hidden="true">
      <span id="beat">-</span>
      <span id="chord">-</span>
      <span id="chorus">-</span>
      <span id="phraseCount">phrases -</span>
      <span id="wordCount">words -</span>
      <span id="charCount">chars -</span>
      <ol id="events"></ol>
    </div>

    <div id="media" aria-hidden="true"></div>

    <script>
      window.MusicBG = {
        beatProgress: 0,
        beatIndex: -1,
        isChorus: false,
        isPlaying: false,
        phraseIndex: 0,
        phrase: { index: 0, text: "", startTime: -1, endTime: -1, progress: 0 },
        lyric: { active: false, progress: 0, wordStart: -1, charStart: -1, vocal: 0 }
      };
    </script>
    <script src="https://unpkg.com/axios@1.17.0/dist/axios.min.js"></script>
    <script src="https://unpkg.com/textalive-app-api@0.4.0/dist/index.js"></script>
    <script type="module" src="./stage3d.js"></script>
    <script src="./lyrics3d.js"></script>
    <script src="./textpv.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
